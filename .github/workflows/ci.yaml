name: testing

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: cache node
        uses: actions/cache@v5

      - name: Dep install
        run: npm install
          
      - name: Run test
        run: npm test

      - name: Summary
        run: |
          echo "## Résultat des tests" > $GITHUB_STEP_SUMMARY
          echo "✅ Tous les tests sont passés" > $GITHUB_STEP_SUMMARY

      

