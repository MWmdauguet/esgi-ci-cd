name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Cache node
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Dep install
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build file exist
        run: |
          if [ -d "./dist" ]; then
            echo "Le dossier dist existe"
          else
            echo "Le dossier dist n'existe pas"
            exit 1
          fi

      - name: Artefact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

      - name: Summary
        run: |
          echo "## Résultat des tests" > $GITHUB_STEP_SUMMARY
          echo "✅ Tous les tests sont passés" >> $GITHUB_STEP_SUMMARY